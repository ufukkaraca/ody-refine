name: Feature Request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do? Why is the current behavior insufficient?
      placeholder: "I want to scan Confluence pages directly, but currently I have to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you tried any workarounds?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI (ody-refine)
        - Detectors
        - Report (HTML output)
        - CI integration
        - Configuration
        - Documentation
        - Other
